name: Metrics

on:
  schedule:
    - cron: "0 1 * * *"  # 1am UTC daily, after snake workflow runs at midnight
  workflow_dispatch:       # run manually from Actions tab to generate on first use

permissions:
  contents: write

jobs:
  metrics:
    name: Generate Metrics SVGs
    runs-on: ubuntu-latest
    steps:
      # ── Step 1: Isometric 3D contribution calendar ──────────────────────────
      # Generates: github-metrics-isocalendar.svg
      # This is the jaw-dropping 3D column calendar displayed in the README
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT }}
          user: SD10LEGACY
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata
          config_output: svg
          filename: github-metrics-isocalendar.svg
          committer_branch: main
          committer_message: "chore: update isometric calendar metrics [skip ci]"

      # ── Step 2: Coding habits heatmap + achievements ─────────────────────────
      # Generates: github-metrics.svg
      # Shows: when you code (morning/night/weekday), achievements unlocked
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT }}
          user: SD10LEGACY
          base: activity
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          config_timezone: Asia/Kolkata
          config_output: svg
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore: update habits metrics [skip ci]"
