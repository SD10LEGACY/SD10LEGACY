name: Generate Datas

on:
  schedule:
    - cron: "0 0 * * *"   # runs once daily at midnight UTC — no spam
  workflow_dispatch:        # keep manual trigger so you can run it yourself anytime
  # NOTE: "push" trigger intentionally removed — it caused an infinite loop
  # (workflow commits README → push triggers workflow → commits again → repeat)

permissions:
  contents: write

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout with GH_PAT so the final push back to main is authenticated
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # 2. Generate the Snake Animation SVGs
      - uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: SD10LEGACY
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Push SVGs to the output branch
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 5. Install dependencies
      - name: Install Python dependencies
        run: pip install requests

      # 6. Run the contribution count script
      - name: Update Contribution Count
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python update_count.py

      # 7. Commit and push — two critical fixes here:
      #    a) remote URL explicitly uses GH_PAT to avoid the 403 error
      #    b) commit message contains [skip ci] so the push does NOT
      #       re-trigger this workflow — breaks the infinite loop
      - name: Commit and Push Updated README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/SD10LEGACY/SD10LEGACY.git
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update dynamic contribution count [skip ci]" && git push)
