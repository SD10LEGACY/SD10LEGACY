name: Generate Datas

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours — stays fresh, no spam
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # fixes Node.js 20 deprecation warnings

jobs:
  generate-snake:
    name: Generate Snake Animation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SD10LEGACY
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    name: Update Contribution Count
    runs-on: ubuntu-latest
    steps:
      # SECRET NAME: Go to repo Settings → Secrets → Actions
      # Your secret must be named exactly: GH_PAT
      # PAT needs scopes: repo (full) + workflow
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and write contribution count
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python update_count.py

      - name: Commit and push updated README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/SD10LEGACY/SD10LEGACY.git
          git add README.md
          git diff --staged --quiet && echo "Nothing to commit" || (git commit -m "chore: update contribution count [skip ci]" && git push)
